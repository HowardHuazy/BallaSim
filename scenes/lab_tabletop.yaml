         attribution: "desk_lamp_arm_01, Poly Haven"}
  bulb: {path: "${ASSETS}/polyhaven/lightbulb_01/lightbulb_01_2k.gltf", license: CC0-1.0,
         attribution: "lightbulb_01, Poly Haven"}
  rim: {path: "${ASSETS}/polyhaven/rusted_wheel_rim_02/rusted_wheel_rim_02_2k.gltf", license: CC0-1.0,
        attribution: "rusted_wheel_rim_02, Poly Haven"}
  cardboard: {path: "${ASSETS}/polyhaven/cardboard_box_01/cardboard_box_01_2k.gltf", license: CC0-1.0,
              attribution: "cardboard_box_01, Poly Haven"}
  cracker: {path: "${ASSETS}/ycb/003_cracker_box/extracted/003_cracker_box/google_64k/textured.obj", scale: 1.0,
            license: CC-BY-4.0, attribution: "YCB Object and Model Set, Calli et al., CC BY 4.0"}
  soup_can: {path: "${ASSETS}/ycb/005_tomato_soup_can/extracted/005_tomato_soup_can/google_64k/textured.obj",
