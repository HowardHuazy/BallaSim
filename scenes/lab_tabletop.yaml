  mains: {type: fourier, f0_hz: 120.0, a: [0.2], phi: [0.0]}          # 20 % modulation depth
  strobe: {type: pulse, f_hz: 200.0, duty: 0.06, rise_s: 5.0e-5, phase_s: 0.0, floor: 0.0}   # Vicon-like; no light uses it by default

lights:
  - {kind: ambient, intensity: 0.15}
  - {kind: point, position_m: [0.0, -0.4, 3.2], intensity: 9.0}       # overhead
  - {kind: spot, body: desk_lamp, position_m: [0.0155, 0.184, 0.72], direction: [0.0, 0.3, -1.0],
     spot_inner_deg: 25, spot_outer_deg: 40, intensity: 1.5, color: [1.0, 0.95, 0.85]}
  - {kind: point, body: bulb, group: mains, position_m: [0.0, 0.0, 0.12], intensity: 0.4,
     color: [1.0, 0.85, 0.65]}                                          # 2 cm above the glass
  # Uncomment for a Vicon-like strobe (scene variant with the 200 Hz pulse group):
  # - {kind: point, group: strobe, position_m: [0.0, 0.0, 3.5], intensity: 6.0, casts_shadows: false}
