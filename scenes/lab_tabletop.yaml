# BallaSim Phase 1 synthetic scene 1, "Lab tabletop" (docs/research/A-assets-shortlist.md §2).
#
# An EVIMO2-like lab: a 6.85 x 7.65 x 4.3 m room (G3's measured EV-IMO footprint) with painted
# brick walls, a concrete floor and a plaster ceiling; a 2 m metal desk in the middle; six movers,
# one per EVIMO2 object class (box, can, knife, plane, car, wheel); a desk lamp spot light, an
# overhead point light, ambient light and a visible bulb flickering at 120 Hz (mains group). The
# camera uses the EVIMO2 left Prophesee calibration and moves hand-held style: 1 s hold, slow pan
# and translation, a fast shake (~200 deg/s peaks), then a 1.4 s hold. Duration 8 s.
#
# World: metres, +Z up, floor at z = 0, desk top at z = 0.788 m (the Poly Haven desk's height).
#
# ASSETS AND ATTRIBUTION (files under ${ASSETS}, default /data/assets; never
# copied into this repository). All are CC0 or CC BY 4.0; CC BY items require attribution and a
# note of the changes when renders or derived assets are published:
#   - Poly Haven (CC0): metal_office_desk, desk_lamp_arm_01, lightbulb_01, rusted_wheel_rim_02,
#     cardboard_box_01. https://polyhaven.com/license
#   - ambientCG (CC0, Lennart Demes): PaintedBricks004, Concrete034, PaintedPlaster017.
#     https://docs.ambientcg.com/license/
#   - "YCB Object and Model Set, Calli et al., CC BY 4.0" (https://registry.opendata.aws/ycb-benchmarks/):
#     003_cracker_box, 005_tomato_soup_can, 032_knife, 072-a_toy_airplane (google_64k meshes).
#   - "Google Scanned Objects, Google Research, CC BY 4.0"
#     (https://fuel.gazebosim.org/1.0/GoogleResearch/models/CITY_TAXI_POLICE_CAR): CITY_TAXI_POLICE_CAR.
# Changes made by BallaSim's importer: Y-up to Z-up rotation (glTF), validation (degenerate and
# duplicate triangles removed), rotation into the body frame and re-centring; the wheel rim is
# scaled by 0.4; the bulb glass is rendered opaque and emissive (Phase 1 has no transparency).
# Room texture tile sizes: 1.55 m for PaintedBricks004 (A-assets-shortlist); 2.0 m assumed for
# Concrete034 and PaintedPlaster017.
#
# Keyframes of the tipping box, rolling can, knife flick, airplane arc and car drive are sampled
# from analytic motions by scenes/lab_tabletop_keys.py (rolling without slipping for the can,
# rotation about the bottom edge for the box); the fitter interpolates them exactly with K = 6
# splines and holds (DESIGN §5.4).

schema: ballasim.scene/1
name: lab_tabletop
variables:
  ASSETS: /data/assets
time: {t_start_s: 0.0, t_end_s: 8.0}
origin_world_m: [0.0, 0.0, 1.0]
semantic_classes: {room: 1, furniture: 2, object: 3, fixture: 4}

assets:
