  concrete: {texture: "${ASSETS}/ambientcg/Concrete034/extracted/Concrete034_2K-JPG_Color.jpg", tile_m: [2.0, 2.0]}
  plaster: {texture: "${ASSETS}/ambientcg/PaintedPlaster017/extracted/PaintedPlaster017_2K-JPG_Color.jpg", tile_m: [2.0, 2.0]}

room: {name: room, id: 1, semantic: room, size_m: [6.85, 7.65, 4.3], center_m: [0.0, 0.0], cell_m: 0.5,
       walls: bricks, floor: concrete, ceiling: plaster}

bodies:
